name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the history secret scan
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Mailpit and Gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/axllent/mailpit/releases/download/v1.34.0/mailpit-linux-amd64.tar.gz | tar -xz -C "$HOME/.local/bin" mailpit
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate disposable seed password
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "SEED_PASSWORD=$pw" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Initialize disposable database
        run: |
          npx prisma migrate deploy
          npm run seed
      - run: npm run test:unit
      - run: npm run test:e2e
      - name: Secret scan (working tree)
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --no-banner --redact
      - name: Secret scan (history)
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
      - name: Seed password not committed
        run: "! git ls-files -z | xargs -0 grep -lF -- \"$SEED_PASSWORD\""
